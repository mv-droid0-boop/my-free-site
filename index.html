<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页 | Hosted on Cloudflare</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #f38020;
      --accent-hover: #fa9543;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-block;
      background: rgba(243, 128, 32, 0.15);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      border: 1px solid rgba(243, 128, 32, 0.3);
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      color: var(--text-sub);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .status-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
      text-align: left;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }
    .status-item:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }
    .status-label {
      color: var(--text-sub);
    }
    .status-value {
      font-weight: 600;
      color: #38bdf8;
    }
    .status-ok {
      color: #4ade80;
    }
    .cta-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .cta-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Powered by Cloudflare Pages</div>
    <h1>我的首个免费网站</h1>
    <p>恭喜！你的网站已成功通过 Cloudflare Pages 免费上线。享有全球高速边缘网络、无限流量与免费 SSL 加密。</p>

    <div class="status-box">
      <div class="status-item">
        <span class="status-label">CDN 状态</span>
        <span class="status-value status-ok">● 正常运行 (Global Edge)</span>
      </div>
      <div class="status-item">
        <span class="status-label">安全防护</span>
        <span class="status-value status-ok">● 免费 SSL / HTTPS</span>
      </div>
      <div class="status-item">
        <span class="status-label">托管服务商</span>
        <span class="status-value">Cloudflare Pages</span>
      </div>
    </div>

    <a href="#" class="cta-btn" onclick="alert('这是你的专属免费网站，随时编辑 index.html 即可更新内容！')">开始探索</a>
  </div>
  <footer>© 2026 个人专属站点 · 永久免费托管</footer>
</body>
</html>
